name: Validate report app
on:
  pull_request:
    branches: [main]
  push:
    branches: [improve/multi-outlet-daily-report-2026-11]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test storage migrations and reporting periods
        run: node tests/report-store.test.js
      - name: Test MIS import and report date behavior
        run: node tests/report-ui.test.js
      - name: Test Gamma MIS sample formats and saved monthly reports
        run: node tests/gamma-mis.test.js
      - name: Verify direct WhatsApp buttons
        run: node tests/whatsapp-direct.test.js
      - name: Verify original Gamma MIS upload and restored interface
        run: node tests/original-mis-rollback.test.js
      - name: Test outlet selector and date navigation
        run: node tests/outlet-date-navigation.test.js
      - name: Validate JavaScript syntax
        run: |
          node --check gamma-mis.js
          node --check report-store.js
          node --check sw.js
          node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const s=html.match(/<script>\s*([\s\S]*?)<\/script>/);if(!s)throw Error('Missing app script');new Function(s[1]);"
